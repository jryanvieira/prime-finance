app = "dash-fin-api"
primary_region = "gru" # São Paulo, Brazil (or change to your preferred region)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/data/dash-fin.sqlite"
  # You must set these secrets via CLI later:
  # fly secrets set ACCESS_TOKEN_SECRET="your_secret_here" REFRESH_TOKEN_SECRET="your_secret_here" ALLOWED_ORIGINS="https://your-frontend-vercel.app"

[mounts]
  source = "dash_fin_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
